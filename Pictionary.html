    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Fredoka One', cursive;
        }

        /* --- Dashboard Grid Styles --- */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            width: 100%;
            padding: 1rem;
        }

        .theme-btn {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .theme-unlocked {
            background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(252, 96, 118, 0.4);
            cursor: pointer;
        }
        
        .theme-unlocked:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(252, 96, 118, 0.5);
        }

        .theme-locked {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border: 2px dashed #cbd5e1;
        }

        /* --- Game Card Styles --- */
        .item-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 3/4; /* Guarantees identically sized cards */
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-img-container {
            width: 100%;
            height: 60%; 
            position: relative;
            overflow: hidden;
            background-color: #f3f4f6; /* Fallback background */
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .item-card:hover .card-img {
            transform: scale(1.08);
        }

        .card-text-container {
            width: 100%;
            height: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            padding: 1rem;
        }

        .card-visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .card-hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        /* --- Animations --- */
        @keyframes float {
            0% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -55%) rotate(5deg); }
            100% { transform: translate(-50%, -50%) rotate(-5deg); }
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes winnerBounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        .animate-winner {
            animation: winnerBounce 2.5s ease infinite;
        }
        
        /* Smooth screen transitions */
        .screen {
            transition: opacity 0.5s ease;
        }
    </style>

                        "It disappears in a second.",
                        "We watch the sky at night."
                    ] },
                    { id: 8, name: "UFO", emoji: "🛸", fact: "UFO means unidentified flying object. People in stories often imagine UFOs as flying saucers from other planets.", sentences: [
                        "The UFO is in the sky.",
                        "The UFO is round.",
                        "I see a UFO in the movie.",
                        "The UFO has bright lights.",
                        "Do you believe in UFOs?"
                    ] },
                    { id: 9, name: "Sunrise", emoji: "🌅", fact: "The sunrise is the moment when the sun appears in the morning. The sky often turns orange, pink and gold.", sentences: [
                        "The sunrise is beautiful.",
                        "I watch the sunrise.",
                        "The sunrise is at six o'clock.",
                        "The sky is orange.",
                        "We wake up early for the sunrise."
                    ] },
                    { id: 10, name: "Rocket", emoji: "🚀", fact: "A rocket is a powerful machine that goes into space. It burns fuel to fly very fast and leave the Earth.", sentences: [
                        "The rocket goes to space.",
                        "The rocket is tall.",
                        "Three, two, one, go!",
                        "The rocket is fast.",
                        "Astronauts travel in a rocket."
                    ] }
                ]
            }
        };


        // --- 200-THEME CURRICULUM ---
        const themeTitles = ["Pets", "Toys", "Basic Breakfast", "Weather", "Rooms in the House", "Basic Clothing", "Transportation", "Wild Animals", "Fast Food", "Basic Drinks", "Fruits", "Vegetables", "Body Parts", "School Supplies", "Furniture & Decor", "Snacks", "Common Jobs", "Indoor Hobbies", "Outdoor Sports", "Technology Basics", "Farm Animals", "Emotions", "Bathroom Items", "Kitchen Utensils", "Sweet Desserts", "Classroom Items", "Birds", "Insects", "Sea Animals", "Musical Instruments", "Flowers & Plants", "Footwear", "Accessories", "Places in the City", "Tools", "Staple Foods", "Playground & Fun Fair", "At the Restaurant", "Sports Equipment", "Sky & Space", "Holiday Celebrations", "Party Items", "Money & Shopping", "Traffic & Street Signs", "Menu Dishes", "At the Hotel", "Cleaning Items", "Health & Medicine", "People & Ages", "At the Airport", "Daily Routines", "Berries & Tropical Fruits", "More Vegetables", "Seafood", "Condiments & Spices", "Booking & Tickets", "Where to Stay", "Landscapes", "Movie Genres", "Camping Items", "Beach Items", "Winter Items", "Chores", "Office Items", "School Subjects", "Types of Buildings", "Work Vehicles", "Elements of Nature", "Small Mammals", "Farm Life", "Art & Craft Supplies", "Outdoor Hobbies", "Exercise & Fitness", "More Jobs", "Hand Gestures", "Gifts", "Supermarket Sections", "Giving Directions", "Modes of Communication", "Gadgets", "Entertainment", "Games", "Water Sports", "Weddings", "Hair & Beauty", "Formal Wear", "Costumes", "Candy & Sweets", "On the Plane", "Mail & Post", "Baggage & Check-in", "At the Hospital", "Arctic Animals", "Exotic Animals", "Trees & Leaves", "Lunch & Dinner", "Sandwich Ingredients", "Pizza Toppings", "Ice Cream Flavors", "Dinosaurs", "Moods & Reactions", "Space Exploration", "Science Lab", "Inside the Body", "Natural Disasters", "Energy Sources", "Eco-Friendly Habits", "Environmental Problems", "Money & Finance", "Business Life", "Extreme Sports", "Creative Hobbies", "Inventions", "Medieval Times", "Ancient World", "Pirates & Treasure", "Mythological Creatures", "Magical Items", "Fairy Tales", "Dream Jobs", "Tools of the Trade", "Music Gear", "Performing Arts", "At the Movies", "Travel Problems", "Computer Parts", "Dream Home Features", "Gardening", "Road Trip", "Boats & Ships", "Team vs. Individual Sports", "Olympic Sports", "Brain Games", "Christmas", "Easter & Spring", "Autumn", "Vacation Activities", "Theme Park", "Hotel Services", "Cafe Orders", "Baking Ingredients", "Spices & Herbs", "Healthy Foods", "World Cuisines", "Safety Items", "Weekend Plans", "Souvenirs & Memories", "Luxury Items", "Reading Materials", "News & Media", "Animal Idioms", "Weather Idioms", "Food Idioms", "Body Idioms", "Money Idioms", "Time Idioms", "Nature Idioms", "Phrasal Verbs: Everyday", "Phrasal Verbs: Travel", "Phrasal Verbs: Work", "Make vs. Do", "Law & Justice", "Politics & Government", "Economy & Business", "Real Estate & Housing", "Education & Degrees", "Illnesses & Symptoms", "Wellbeing", "Relationships", "Personality Traits", "AI & Data", "Online Safety", "Astronomy", "Earth Science", "Biology", "Physics & Energy", "Math Symbols", "Navigation", "Architecture", "Fine Art", "Literature & Writing", "Orchestra Instruments", "Sewing & Textiles", "Cooking Methods", "Festivals & Parades", "Natural Wonders", "Infrastructure", "City Life", "At the Stadium", "Awards & Success", "Mystery & Crime Solving", "Future Technology", "Opinions & Debate", "Reviews & Ratings", "Life Milestones", "Professional Roles", "Survival Skills", "Sleep & Dreams", "Common Fears", "Ideal Vacations"];
        const phases = [
            { from: 1,   to: 50,  level: "A1", name: "Survival & The Tangible World",     focus: "Concrete nouns, immediate surroundings, and survival vocabulary.", color: "from-orange-400 to-rose-500" },
            { from: 51,  to: 100,  level: "A2", name: "Expanding the Environment",         focus: "Describing things, daily routines, community, and travel.", color: "from-amber-400 to-orange-500" },
            { from: 101, to: 150,  level: "B1", name: "Experiences & Sensations",          focus: "Modals, feelings, materials, and abstract concepts.", color: "from-emerald-400 to-teal-500" },
            { from: 151, to: 200, level: "B2", name: "Nuance, Choices & Debates",         focus: "Defending opinions, hypothetical scenarios, idioms, and complex debates.", color: "from-indigo-400 to-purple-500" }
        ];

        // --- EMOJI IMAGE GENERATOR (100% offline) ---
        // Builds a colorful card with the item's emoji as an inline SVG (data URI).
        function fallbackImage(item) {
            const palette = [['#fde68a','#f59e0b'],['#bfdbfe','#3b82f6'],['#bbf7d0','#10b981'],['#fbcfe8','#ec4899'],['#ddd6fe','#8b5cf6'],['#fed7aa','#f97316']];
            const [c1, c2] = palette[(item.name.length + item.name.charCodeAt(0)) % palette.length];
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="500" height="500" fill="url(#g)"/><text x="250" y="320" font-size="240" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${item.emoji}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function setImage(imgEl, item) {
            // Emoji only: always a locally generated image, nothing is requested from the internet.
            imgEl.onerror = null;
            imgEl.src = fallbackImage(item);
        }

        // --- GLOBAL STATE ---
        let currentActiveThemeId = null;
        let itemQueue = [];
        let currentLeft = null;
        let currentRight = null;
        let isAnimating = false;
        let totalRounds = 0;
        let currentRound = 1;

        // DOM Elements
        const elMenuScreen = document.getElementById('menu-screen');
        const elGameScreen = document.getElementById('game-screen');
        const elWinnerScreen = document.getElementById('winner-screen');
        
        const cardLeft = document.getElementById('card-left');
        const imgLeft = document.getElementById('img-left');
        const nameLeft = document.getElementById('name-left');
        
        const cardRight = document.getElementById('card-right');
        const imgRight = document.getElementById('img-right');
        const nameRight = document.getElementById('name-right');

        function buildDashboard() {
            const root = document.getElementById('dashboard-grid');
            root.innerHTML = '';

            phases.forEach((p, idx) => {
                const unlocked = [];
                for (let i = p.from; i <= p.to; i++) if (masterData[i]) unlocked.push(i);

                const section = document.createElement('section');
                section.className = idx === 0 ? '' : 'mt-8';
                section.innerHTML = `
                    <div class="flex flex-wrap items-center gap-3 px-4 pt-2">
                        <span class="bg-gradient-to-r ${p.color} text-white font-display text-lg px-4 py-1 rounded-full shadow">Phase ${idx + 1} · ${p.level}</span>
                        <h2 class="font-display text-2xl text-gray-800">${p.name}</h2>
                        <span class="text-sm font-bold text-gray-400 ml-auto">${unlocked.length}/${p.to - p.from + 1} ready</span>
                    </div>
                    <p class="px-4 mt-1 text-gray-500 font-semibold">${p.focus}</p>`;

                const grid = document.createElement('div');
                grid.className = 'theme-grid';

                for (let i = p.from; i <= p.to; i++) {
                    const btn = document.createElement('button');
                    if (masterData[i]) {
                        btn.className = 'theme-btn theme-unlocked group';
                        btn.innerHTML = `
                            <span class="text-4xl mb-2 group-hover:scale-125 transition-transform">${masterData[i].emoji}</span>
                            <span class="font-display text-lg leading-tight drop-shadow-sm">${masterData[i].title}</span>
                            <span class="absolute top-2 right-2 text-xs bg-white/20 px-2 rounded-full font-bold">#${i}</span>
                        `;
                        btn.onclick = () => startGame(i);
                    } else {
                        btn.className = 'theme-btn theme-locked';
                        btn.innerHTML = `
                            <span class="text-2xl mb-1 text-gray-400">🔒</span>
                            <span class="font-bold text-sm leading-tight">${themeTitles[i - 1]}</span>
                            <span class="text-xs mt-1">Coming Soon</span>
                            <span class="absolute top-2 right-2 text-xs bg-black/5 px-2 rounded-full font-bold">#${i}</span>
                        `;
                    }
                    grid.appendChild(btn);
                }
                section.appendChild(grid);
                root.appendChild(section);
            });
        }

        function switchScreen(hideId, showId) {
            const elHide = document.getElementById(hideId);
            const elShow = document.getElementById(showId);
            
            elHide.style.opacity = '0';
            setTimeout(() => {
                elHide.classList.add('hidden');
                elShow.classList.remove('hidden');
                elShow.classList.add('flex');
                
                void elShow.offsetWidth; // Reflow
                
                elShow.style.opacity = '1';
            }, 500); 
        }

        function showMenu() {
            if(!elGameScreen.classList.contains('hidden')) switchScreen('game-screen', 'menu-screen');
            if(!elWinnerScreen.classList.contains('hidden')) switchScreen('winner-screen', 'menu-screen');
        }

        function startGame(themeId) {
            currentActiveThemeId = themeId;
            const theme = masterData[themeId];
            
            document.getElementById('game-title').textContent = theme.title;
            
            itemQueue = [...theme.items].sort(() => Math.random() - 0.5);
            totalRounds = itemQueue.length - 1; 
            currentRound = 1;
            
            currentLeft = itemQueue.shift();
            currentRight = itemQueue.shift();

            cardLeft.classList.remove('card-hidden');
            cardLeft.classList.add('card-visible');
            cardRight.classList.remove('card-hidden');
            cardRight.classList.add('card-visible');

            updateUI();
            switchScreen('menu-screen', 'game-screen');
        }

        function updateUI() {
            setImage(imgLeft, currentLeft);
            nameLeft.textContent = currentLeft.name;
            
            setImage(imgRight, currentRight);
            nameRight.textContent = currentRight.name;

            document.getElementById('progress-text').textContent = `Round ${currentRound} of ${totalRounds}`;
        }

        async function handleChoice(chosenSide) {
            if (isAnimating) return; 
            isAnimating = true;

            const winningItem = chosenSide === 'left' ? currentLeft : currentRight;
            const cardToHide = chosenSide === 'left' ? cardRight : cardLeft;
            
            cardToHide.classList.remove('card-visible');
            cardToHide.classList.add('card-hidden');

            await new Promise(resolve => setTimeout(resolve, 400));

            if (itemQueue.length === 0) {
                showWinnerScreen(winningItem);
                return;
            }

            const nextChallenger = itemQueue.shift();
            
            if (chosenSide === 'left') {
                currentRight = nextChallenger;
                setImage(imgRight, currentRight);
                nameRight.textContent = currentRight.name;
            } else {
                currentLeft = nextChallenger;
                setImage(imgLeft, currentLeft);
                nameLeft.textContent = currentLeft.name;
            }

            currentRound++;
            document.getElementById('progress-text').textContent = `Round ${currentRound} of ${totalRounds}`;

            await new Promise(resolve => setTimeout(resolve, 100));

            cardToHide.classList.remove('card-hidden');
            cardToHide.classList.add('card-visible');

            await new Promise(resolve => setTimeout(resolve, 400));
            isAnimating = false;
        }

        cardLeft.addEventListener('click', () => handleChoice('left'));
        cardRight.addEventListener('click', () => handleChoice('right'));

        function showWinnerScreen(winner) {
            setImage(document.getElementById('img-winner'), winner);
            document.getElementById('name-winner').textContent = winner.name;
            document.getElementById('fact-winner').textContent = winner.fact;
            
            const sentencesList = document.getElementById('sentences-winner');
            sentencesList.innerHTML = ''; 
            winner.sentences.forEach(sentence => {
                const li = document.createElement('li');
                li.className = 'bg-blue-50 text-gray-700 p-3 rounded-lg border border-blue-100 text-lg shadow-sm flex items-start gap-3';
                li.innerHTML = `<span class="text-blue-400 mt-1">▶</span> <span>${sentence}</span>`;
                sentencesList.appendChild(li);
            });
            
            switchScreen('game-screen', 'winner-screen');
            setTimeout(() => {
                fireConfetti();
                isAnimating = false;
            }, 600); 
        }

        function fireConfetti() {
            var duration = 3.5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100, useWorker: false };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function resetGame() {
            if (currentActiveThemeId) {
                switchScreen('winner-screen', 'game-screen');
                setTimeout(() => {
                    startGame(currentActiveThemeId);
                }, 500);
            }
        }

        // Initialize dashboard on load
        window.onload = () => {
            buildDashboard();
            elMenuScreen.style.opacity = '1';
        };
    </script>
